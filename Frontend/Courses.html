<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>All Courses - Seeds of Wealth</title>
  <link rel="stylesheet" href="Colors.css">
  <link rel="stylesheet" href="shared.css">
  <style>
    .courses-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .course-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .course-card:hover {
      transform: translateY(-4px);
      border-color: currentColor;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .course-card.beginner {
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.05);
    }

    .course-card.beginner:hover {
      background: rgba(16, 185, 129, 0.1);
    }

    .course-card.intermediate {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.05);
    }

    .course-card.intermediate:hover {
      background: rgba(245, 158, 11, 0.1);
    }

    .course-card.advanced {
      color: #8b5cf6;
      border-color: rgba(139, 92, 246, 0.3);
      background: rgba(139, 92, 246, 0.05);
    }

    .course-card.advanced:hover {
      background: rgba(139, 92, 246, 0.1);
    }

    .course-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .course-category {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: currentColor;
      color: white;
    }

    .course-title {
      margin: 16px 0 8px 0;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .course-info {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--muted-text);
      margin: 12px 0;
    }

    .course-info-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .modules-list {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .module-link {
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted-text);
      text-decoration: none;
      font-size: 12px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .module-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-color: currentColor;
    }

    .filter-section {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
      font-weight: 600;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .page-title {
      text-align: center;
      margin: 32px 0;
    }

    .page-title h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: var(--muted-text);
      font-size: 15px;
    }
  </style>
</head>
<body data-requires-auth="true" data-requires-access="true">
  <script src="api-config.js"></script>
  <script src="auth.js"></script>
    <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="Lobby.html">Seeds of Wealth</a>
      <nav class="header-nav">
        <a class="nav-link" href="SoW.html">Home</a>
        <a class="nav-link" href="Lobby.html">Lobby</a>
        <a class="nav-link" href="Introduction to course.html">Info</a>
      </nav>
      <div class="header-actions">
        <a class="nav-link" id="accountBtn" href="#" onclick="goToAccount(event)">Account</a>
      </div>
    </div>
  </header>

  <main style="min-height: 100vh;">
    <div class="page-title">
      <h1>📚 All Courses</h1>
      <p>Choose a course and dive into its modules</p>
    </div>

    <div class="filter-section">
      <button class="filter-btn active" onclick="filterCourses('all')">All Courses</button>
      <button class="filter-btn" onclick="filterCourses('beginner')">Beginner</button>
      <button class="filter-btn" onclick="filterCourses('intermediate')">Intermediate</button>
      <button class="filter-btn" onclick="filterCourses('advanced')">Advanced</button>
    </div>

    <div class="courses-container" id="coursesContainer">
      <!-- Courses will be loaded here -->
    </div>
  </main>

  <script>

      ]},

      ]},
      { id: 14, title: "Advanced Portfolio Management", instructor: "Victoria Sterling", category: "advanced", totalModules: 3, estimatedTime: "6 weeks", modules: [
        { id: 1, name: "Institutional Portfolio Strategy" },

      ]},
      { id: 15, title: "Algorithmic Trading Fundamentals", instructor: "Nathan Brooks", category: "advanced", totalModules: 3, estimatedTime: "6 weeks", modules: [
        { id: 1, name: "Trading Theory and Strategy Development" },
        { id: 2, name: "Code Basics and Implementation" },
        { id: 3, name: "Backtesting and Performance Analysis" }
      ]},
      { id: 16, title: "Macroeconomic Analysis & Market Timing", instructor: "Dr. Patricia Gray", category: "advanced", totalModules: 3, estimatedTime: "4 weeks", modules: [
        { id: 1, name: "Economic Indicators and Analysis" },
        { id: 2, name: "Sector Rotation and Market Timing" },
        { id: 3, name: "Market Sentiment and Contrarian Investing" }
      ]},
      { id: 17, title: "Alternative Investments & Commodities", instructor: "Richard Hayes", category: "advanced", totalModules: 3, estimatedTime: "4 weeks", modules: [
        { id: 1, name: "Commodity Investing" },
        { id: 2, name: "Ways to Invest in Commodities" },
        { id: 3, name: "Alternative Investment Strategies" }
      ]}
    ];

    let currentFilter = 'all';

    function renderCourses(filter = 'all') {
      const container = document.getElementById('coursesContainer');
      container.innerHTML = '';

      const filtered = filter === 'all' ? coursesData : coursesData.filter(c => c.category === filter);

      filtered.forEach(course => {
        const courseCard = document.createElement('div');
        courseCard.className = `course-card ${course.category}`;

        courseCard.innerHTML = `
          <div class="course-header">
            <span class="course-category">${course.category}</span>
          </div>
          <h3 class="course-title">${course.title}</h3>
          <div class="course-info">
            <span class="course-info-item">👨‍🏫 ${course.instructor}</span>
            <span class="course-info-item">📚 ${course.totalModules} modules</span>
            <span class="course-info-item">⏱️ ${course.estimatedTime}</span>
          </div>
          <div class="modules-list">
            ${course.modules.map(mod => `
              <a href="Module-${course.id}-${mod.id}.html" class="module-link">
                → Module ${mod.id}: ${mod.name}
              </a>
            `).join('')}
          </div>
        `;

        container.appendChild(courseCard);
      });
    }

    function filterCourses(category) {
      currentFilter = category;
      
      // Update button states
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      renderCourses(category);
    }

    function goToAccount(event) {
      event.preventDefault();
      const userId = localStorage.getItem('userId');
      if (userId) {
        window.location.href = 'Account.html';
      } else {
        window.location.href = 'Login.html';
      }
    }

    // Initial render
    renderCourses();
  </script>
</body>
</html>

  <link rel="stylesheet" href="Colors.css">

  <script>
    function goToAccount(event) {
      event.preventDefault();
      const userId = localStorage.getItem('userId');
      if (userId) {
        window.location.href = 'Account.html';
      } else {
        window.location.href = 'Login.html';
      }
    }

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Log in to Seeds of Wealth and continue your investing journey." />
	<title>Log In - Seeds of Wealth</title>
	<link rel="stylesheet" href="Colors.css" />
	<link rel="stylesheet" href="shared.css" />
	<link rel="stylesheet" href="login.css" />
</head>
<body>
	<main class="card" role="main">
		<h1>Log In</h1>
		<p class="lead">Welcome back — log in to continue your journey.</p>

		<form id="loginForm" novalidate>
			<div>
				<label for="email">Email</label>
				<input id="email" name="email" type="email" placeholder="you@example.com" required />
				<div class="error" id="emailError">Please enter a valid email address.</div>
			</div>

			<div>
				<label for="password">Password</label>
				<input id="password" name="password" type="password" placeholder="Your password" required />
				<div class="error" id="passwordError">Please enter your password.</div>
			</div>

			<div class="actions">
				<div class="links">
					<a href="Registration.html">Create account</a>
					<span>·</span>
					<a href="#">Forgot password?</a>
				</div>
				<button id="submitBtn" type="submit">Log in</button>
			</div>

			<div class="success" id="successMsg">Logged in successfully — redirecting...</div>
		</form>
	</main>

	<script>
		const form = document.getElementById('loginForm');
		const email = document.getElementById('email');
		const password = document.getElementById('password');

		const emailError = document.getElementById('emailError');
		const passwordError = document.getElementById('passwordError');
		const successMsg = document.getElementById('successMsg');

		function show(el){ el.style.display = 'block' }
		function hide(el){ el.style.display = 'none' }

		function isEmailValid(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) }

		function validate(){
			let ok = true;
			if(!isEmailValid(email.value.trim())){ show(emailError); ok = false } else hide(emailError);
			if(!password.value){ show(passwordError); ok = false } else hide(passwordError);
			return ok;
		}

		form.addEventListener('submit', async (e)=>{
			e.preventDefault();
			successMsg.style.display = 'none';
			if(validate()){
				try {
					const response = await fetch('http://localhost:5000/api/login', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							email: email.value.trim(),
							password: password.value
						})
					});

					const data = await response.json();

					if (data.success) {
						successMsg.textContent = 'Logged in successfully — redirecting...';
						successMsg.style.color = 'var(--color-3)';
						show(successMsg);
						localStorage.setItem('userId', data.user.id);
						localStorage.setItem('userEmail', data.user.email);
						localStorage.setItem('userName', data.user.fullname);
						form.reset();
						setTimeout(()=> window.location.href = 'Lobby.html', 900);
					} else {
						successMsg.textContent = '❌ ' + data.message;
						successMsg.style.color = 'var(--danger)';
						show(successMsg);
					}
				} catch (error) {
					successMsg.textContent = '❌ Connection error. Make sure the backend is running on http://localhost:5000';
					successMsg.style.color = 'var(--danger)';
					show(successMsg);
				}
			}
		});

		// Live validation feedback
		[email,password].forEach(el=>{
			el.addEventListener('input', ()=>{ validate() })
			el.addEventListener('change', ()=>{ validate() })
		})
	</script>
</body>
</html>
